<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セトリメーカー | BBB Chronicle</title>
<meta name="description" content="Base Ball Bearのセットリストを組み立てて保存できるファン制作ツール。">
<link rel="stylesheet" href="styles.css">
<style>
/* ========== Creator layout ========== */
.sc-app {
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto 1fr;
  height: 100dvh;
  overflow: hidden;
}

.sc-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  z-index: 10;
}

.sc-header__back {
  color: var(--ink-dim);
  text-decoration: none;
  font-size: 0.8rem;
  white-space: nowrap;
}
.sc-header__back:hover { color: var(--ink); }

.sc-header__title {
  font-size: 1rem;
  font-weight: 700;
  margin: 0;
  flex: 1;
}

.sc-header__saved-count {
  font-size: 0.75rem;
  color: var(--ink-dim);
  white-space: nowrap;
}

/* ========== Picker panel ========== */
.sc-picker {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--line);
}

.sc-search-wrap {
  padding: 0.75rem 1rem 0;
  flex-shrink: 0;
}

.sc-search {
  width: 100%;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  color: var(--ink);
  font-size: 0.9rem;
  font-family: var(--font);
  outline: none;
}
.sc-search:focus { border-color: var(--accent); }
.sc-search::placeholder { color: var(--ink-dim); }

/* Album tabs */
.sc-album-tabs {
  display: flex;
  gap: 0.35rem;
  padding: 0.6rem 1rem;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.sc-album-tabs::-webkit-scrollbar { display: none; }

.sc-tab {
  flex-shrink: 0;
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.sc-tab:hover { color: var(--ink); border-color: var(--ink-dim); }
.sc-tab.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Song grid */
.sc-songs {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 1rem 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-content: flex-start;
}

.sc-song-chip {
  padding: 0.35rem 0.7rem;
  border-radius: 6px;
  font-size: 0.8rem;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
  text-align: left;
  white-space: nowrap;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sc-song-chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.sc-song-chip:active { transform: scale(0.96); }
.sc-song-chip.is-in-set {
  opacity: 0.4;
  pointer-events: none;
}

.sc-empty {
  color: var(--ink-dim);
  font-size: 0.85rem;
  padding: 1rem 0;
  width: 100%;
}

/* ========== Builder panel ========== */
.sc-builder {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-raised);
}

.sc-meta {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.sc-meta-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
}

.sc-input {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.4rem 0.6rem;
  font-size: 0.8rem;
  color: var(--ink);
  font-family: var(--font);
  width: 100%;
  outline: none;
}
.sc-input:focus { border-color: var(--accent); }
.sc-input::placeholder { color: var(--ink-dim); font-size: 0.75rem; }

/* Section tabs inside builder */
.sc-section-tabs {
  display: flex;
  gap: 0.3rem;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.sc-section-tabs::-webkit-scrollbar { display: none; }

.sc-section-tab {
  flex-shrink: 0;
  padding: 0.28rem 0.6rem;
  border-radius: 5px;
  font-size: 0.72rem;
  font-weight: 600;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  cursor: pointer;
  transition: all 0.12s;
}
.sc-section-tab:hover { color: var(--ink); }
.sc-section-tab.is-active {
  background: var(--live);
  border-color: var(--live);
  color: #111;
}

.sc-add-section {
  flex-shrink: 0;
  padding: 0.25rem 0.5rem;
  border-radius: 5px;
  font-size: 0.72rem;
  background: transparent;
  border: 1px dashed var(--line);
  color: var(--ink-dim);
  cursor: pointer;
  margin-left: auto;
}
.sc-add-section:hover { border-color: var(--accent); color: var(--accent); }

/* Song list in builder */
.sc-setlist {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
}

.sc-setlist-section {
  display: none;
}
.sc-setlist-section.is-active {
  display: block;
}

.sc-setlist-song {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 1rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.85rem;
}
.sc-setlist-song:hover { background: var(--bg); }

.sc-setlist-song__num {
  color: var(--ink-dim);
  font-size: 0.7rem;
  min-width: 1.4rem;
  font-variant-numeric: tabular-nums;
}

.sc-setlist-song__name {
  flex: 1;
}

.sc-setlist-song__up,
.sc-setlist-song__down {
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 0.15rem 0.3rem;
  border-radius: 4px;
}
.sc-setlist-song__up:hover,
.sc-setlist-song__down:hover { background: var(--bg-raised); color: var(--ink); }

.sc-setlist-song__remove {
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  padding: 0.15rem 0.2rem;
  border-radius: 4px;
}
.sc-setlist-song__remove:hover { color: var(--accent); background: var(--accent-soft); }

.sc-setlist-empty {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--ink-dim);
  font-size: 0.82rem;
}

/* Action bar */
.sc-actions {
  padding: 0.75rem 1rem;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}

.sc-btn {
  flex: 1;
  padding: 0.6rem;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: var(--font);
  transition: opacity 0.15s, transform 0.08s;
}
.sc-btn:active { transform: scale(0.97); }

.sc-btn--save {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.sc-btn--save:hover { opacity: 0.88; }

.sc-btn--export {
  background: transparent;
  color: var(--ink-dim);
  border-color: var(--line);
}
.sc-btn--export:hover { color: var(--ink); border-color: var(--ink-dim); }

.sc-btn--clear {
  background: transparent;
  color: var(--ink-dim);
  border-color: var(--line);
  flex: 0 0 auto;
  padding: 0.6rem 0.75rem;
}
.sc-btn--clear:hover { color: var(--accent); border-color: var(--accent); }

/* Song count pill */
.sc-song-count {
  font-size: 0.7rem;
  color: var(--ink-dim);
  padding: 0.1rem 0.4rem;
  background: var(--bg);
  border-radius: 20px;
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  margin-left: 0.25rem;
}

/* Saved setlists panel */
.sc-saved-wrap {
  padding: 0 1rem 0.5rem;
  border-top: 1px solid var(--line);
  max-height: 130px;
  overflow-y: auto;
  flex-shrink: 0;
  scrollbar-width: thin;
}

.sc-saved-label {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
  font-weight: 600;
  padding: 0.5rem 0 0.3rem;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  background: var(--bg-raised);
}

.sc-saved-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3rem 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.78rem;
}
.sc-saved-item:last-child { border-bottom: none; }

.sc-saved-item__info {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sc-saved-item__date {
  color: var(--ink-dim);
  font-size: 0.7rem;
  margin-right: 0.3rem;
}

.sc-saved-item__load {
  font-size: 0.7rem;
  background: none;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 4px;
  cursor: pointer;
  padding: 0.15rem 0.4rem;
}
.sc-saved-item__load:hover { color: var(--ink); border-color: var(--ink-dim); }

.sc-saved-item__del {
  font-size: 0.75rem;
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  padding: 0.1rem;
}
.sc-saved-item__del:hover { color: var(--accent); }

/* Toast */
.sc-toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  padding: 0.5rem 1.2rem;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}
.sc-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== Mobile ========== */
.sc-mobile-tabs {
  display: none;
}

@media (max-width: 680px) {
  .sc-app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }

  .sc-picker,
  .sc-builder {
    display: none;
    grid-column: 1;
    grid-row: 2;
  }

  .sc-picker.is-mobile-visible,
  .sc-builder.is-mobile-visible {
    display: flex;
  }

  .sc-mobile-tabs {
    display: flex;
    grid-column: 1;
    grid-row: 3;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .sc-mobile-tab {
    flex: 1;
    padding: 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--ink-dim);
    font-family: var(--font);
    border-top: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .sc-mobile-tab.is-active {
    color: var(--accent);
    border-top-color: var(--accent);
  }
}
</style>
</head>
<body>

<div class="sc-app" id="scApp">

  <!-- Header -->
  <header class="sc-header">
    <a href="setlists.html" class="sc-header__back">← セトリ統計</a>
    <h1 class="sc-header__title">セトリメーカー</h1>
    <span class="sc-header__saved-count" id="scSavedCount"></span>
  </header>

  <!-- Song Picker -->
  <div class="sc-picker" id="scPicker">
    <div class="sc-search-wrap">
      <input class="sc-search" id="scSearch" type="search" placeholder="曲名を検索…" autocomplete="off" spellcheck="false">
    </div>
    <div class="sc-album-tabs" id="scAlbumTabs"></div>
    <div class="sc-songs" id="scSongs"></div>
  </div>

  <!-- Setlist Builder -->
  <div class="sc-builder" id="scBuilder">
    <!-- Metadata -->
    <div class="sc-meta">
      <div class="sc-meta-row">
        <input class="sc-input" id="scDate" type="date" placeholder="日付">
        <input class="sc-input" id="scVenue" type="text" placeholder="会場名">
      </div>
      <div class="sc-meta-row">
        <input class="sc-input" id="scCity" type="text" placeholder="都市">
        <input class="sc-input" id="scTour" type="text" placeholder="ツアー名">
      </div>
    </div>

    <!-- Section tabs -->
    <div class="sc-section-tabs" id="scSectionTabs"></div>

    <!-- Songs in current section -->
    <div class="sc-setlist" id="scSetlist"></div>

    <!-- Saved setlists -->
    <div class="sc-saved-wrap" id="scSavedWrap">
      <div class="sc-saved-label">保存済みセトリ</div>
      <div id="scSavedList"></div>
    </div>

    <!-- Actions -->
    <div class="sc-actions">
      <button class="sc-btn sc-btn--save" id="scSave">保存</button>
      <button class="sc-btn sc-btn--export" id="scExport">JSON出力</button>
      <button class="sc-btn sc-btn--clear" id="scClear" title="クリア">✕</button>
    </div>
  </div>

  <!-- Mobile bottom tabs -->
  <div class="sc-mobile-tabs">
    <button class="sc-mobile-tab is-active" id="scMobilePickerTab" onclick="switchMobile('picker')">🎵 曲を選ぶ</button>
    <button class="sc-mobile-tab" id="scMobileBuilderTab" onclick="switchMobile('builder')">📋 セトリ確認</button>
  </div>
</div>

<!-- Toast -->
<div class="sc-toast" id="scToast"></div>

<script>
(function () {
  "use strict";

  // ===== State =====
  let allReleases = [];
  let activeRelease = "all";
  let searchQuery = "";

  // sections: [{label, songs:[]}]
  let sections = [
    { label: "本編", songs: [] },
    { label: "アンコール", songs: [] },
  ];
  let activeSection = 0;

  let savedSetlists = [];

  // ===== DOM refs =====
  const scSearch = document.getElementById("scSearch");
  const scAlbumTabs = document.getElementById("scAlbumTabs");
  const scSongs = document.getElementById("scSongs");
  const scSectionTabs = document.getElementById("scSectionTabs");
  const scSetlist = document.getElementById("scSetlist");
  const scSavedList = document.getElementById("scSavedList");
  const scSavedCount = document.getElementById("scSavedCount");
  const scDate = document.getElementById("scDate");
  const scVenue = document.getElementById("scVenue");
  const scCity = document.getElementById("scCity");
  const scTour = document.getElementById("scTour");
  const scToast = document.getElementById("scToast");

  // ===== Load songs.json =====
  fetch("data/songs.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : []))
    .then((data) => {
      allReleases = data || [];
      renderAlbumTabs();
      renderSongs();
    })
    .catch(() => {
      scSongs.innerHTML = '<p class="sc-empty">曲データの読み込みに失敗しました。</p>';
    });

  // ===== Load saved setlists =====
  try {
    const raw = localStorage.getItem("bbb_setlists");
    savedSetlists = raw ? JSON.parse(raw) : [];
  } catch (_) {
    savedSetlists = [];
  }

  renderSectionTabs();
  renderSetlist();
  renderSavedList();
  updateSavedCount();

  // ===== Album tabs =====
  function renderAlbumTabs() {
    scAlbumTabs.innerHTML = "";

    const all = makeTab("all", "すべて");
    scAlbumTabs.appendChild(all);

    // type groups
    ["album", "mini", "singles"].forEach((type) => {
      const label = type === "album" ? "フルアルバム" : type === "mini" ? "ミニアルバム" : "シングル他";
      const group = document.createElement("span");
      group.style.cssText = "border-left:1px solid var(--line);margin:0 0.15rem;";
      scAlbumTabs.appendChild(group);

      allReleases
        .filter((r) => r.type === type)
        .forEach((r) => {
          const lbl = r.year ? `${r.title} '${String(r.year).slice(2)}` : r.title;
          scAlbumTabs.appendChild(makeTab(r.id, lbl));
        });
    });
  }

  function makeTab(id, label) {
    const btn = document.createElement("button");
    btn.className = "sc-tab" + (id === activeRelease ? " is-active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      activeRelease = id;
      searchQuery = "";
      scSearch.value = "";
      renderAlbumTabs();
      renderSongs();
    });
    return btn;
  }

  // ===== Songs picker =====
  function getAllSongs() {
    const seen = new Set();
    const result = [];
    allReleases.forEach((r) => {
      r.songs.forEach((s) => {
        if (!seen.has(s)) { seen.add(s); result.push(s); }
      });
    });
    return result;
  }

  function getPickerSongs() {
    if (activeRelease === "all") {
      return getAllSongs();
    }
    const rel = allReleases.find((r) => r.id === activeRelease);
    return rel ? rel.songs : [];
  }

  function getSetSongs() {
    const s = new Set();
    sections.forEach((sec) => sec.songs.forEach((song) => s.add(song)));
    return s;
  }

  function renderSongs() {
    const query = searchQuery.trim().toLowerCase();
    let songs = query
      ? getAllSongs().filter((s) => s.toLowerCase().includes(query))
      : getPickerSongs();

    const inSet = getSetSongs();
    scSongs.innerHTML = "";

    if (songs.length === 0) {
      scSongs.innerHTML = '<p class="sc-empty">曲が見つかりません。</p>';
      return;
    }

    songs.forEach((song) => {
      const chip = document.createElement("button");
      chip.className = "sc-song-chip" + (inSet.has(song) ? " is-in-set" : "");
      chip.title = song;
      chip.textContent = song;
      chip.addEventListener("click", () => addSong(song));
      scSongs.appendChild(chip);
    });
  }

  // ===== Search =====
  scSearch.addEventListener("input", () => {
    searchQuery = scSearch.value;
    if (searchQuery) {
      activeRelease = "all";
      renderAlbumTabs();
    }
    renderSongs();
  });

  // ===== Setlist builder =====
  function addSong(song) {
    const sec = sections[activeSection];
    if (!sec.songs.includes(song)) {
      sec.songs.push(song);
      renderSongs();
      renderSetlist();
    }
  }

  function removeSong(secIdx, songIdx) {
    sections[secIdx].songs.splice(songIdx, 1);
    renderSongs();
    renderSetlist();
  }

  function moveSong(secIdx, songIdx, dir) {
    const arr = sections[secIdx].songs;
    const target = songIdx + dir;
    if (target < 0 || target >= arr.length) return;
    [arr[songIdx], arr[target]] = [arr[target], arr[songIdx]];
    renderSetlist();
  }

  function renderSectionTabs() {
    scSectionTabs.innerHTML = "";
    sections.forEach((sec, i) => {
      const btn = document.createElement("button");
      btn.className = "sc-section-tab" + (i === activeSection ? " is-active" : "");
      const count = sec.songs.length;
      btn.innerHTML = `${sec.label}<span class="sc-song-count">${count}</span>`;
      btn.addEventListener("click", () => {
        activeSection = i;
        renderSectionTabs();
        renderSetlist();
      });
      scSectionTabs.appendChild(btn);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "sc-add-section";
    addBtn.textContent = "+ セクション";
    addBtn.addEventListener("click", addSection);
    scSectionTabs.appendChild(addBtn);
  }

  function addSection() {
    const label = prompt("セクション名を入力してください（例: アンコール2）");
    if (!label || !label.trim()) return;
    sections.push({ label: label.trim(), songs: [] });
    activeSection = sections.length - 1;
    renderSectionTabs();
    renderSetlist();
  }

  function renderSetlist() {
    scSetlist.innerHTML = "";

    sections.forEach((sec, si) => {
      const div = document.createElement("div");
      div.className = "sc-setlist-section" + (si === activeSection ? " is-active" : "");

      if (sec.songs.length === 0) {
        const empty = document.createElement("div");
        empty.className = "sc-setlist-empty";
        empty.textContent = "← 左から曲を選んでください";
        div.appendChild(empty);
      } else {
        sec.songs.forEach((song, idx) => {
          const row = document.createElement("div");
          row.className = "sc-setlist-song";
          row.innerHTML = `
            <span class="sc-setlist-song__num">${idx + 1}</span>
            <span class="sc-setlist-song__name">${song}</span>
            <button class="sc-setlist-song__up" title="上へ">▲</button>
            <button class="sc-setlist-song__down" title="下へ">▼</button>
            <button class="sc-setlist-song__remove" title="削除">×</button>
          `;
          row.querySelector(".sc-setlist-song__up").addEventListener("click", () => moveSong(si, idx, -1));
          row.querySelector(".sc-setlist-song__down").addEventListener("click", () => moveSong(si, idx, 1));
          row.querySelector(".sc-setlist-song__remove").addEventListener("click", () => removeSong(si, idx));
          div.appendChild(row);
        });
      }

      scSetlist.appendChild(div);
    });

    renderSectionTabs();
  }

  // ===== Save =====
  document.getElementById("scSave").addEventListener("click", () => {
    const totalSongs = sections.reduce((n, s) => n + s.songs.length, 0);
    if (totalSongs === 0) { toast("曲を1曲以上追加してください"); return; }

    const entry = {
      id: Date.now(),
      date: scDate.value || null,
      venue: scVenue.value.trim() || null,
      city: scCity.value.trim() || null,
      tour: scTour.value.trim() || null,
      sets: sections.map((sec) => ({ label: sec.label, songs: [...sec.songs] })),
    };

    savedSetlists.unshift(entry);
    persistSaved();
    renderSavedList();
    updateSavedCount();
    toast("保存しました ✓");
  });

  // ===== Export =====
  document.getElementById("scExport").addEventListener("click", () => {
    const totalSongs = sections.reduce((n, s) => n + s.songs.length, 0);
    if (totalSongs === 0) { toast("曲を追加してから出力してください"); return; }

    const obj = {
      date: scDate.value || "",
      venue: scVenue.value.trim() || "",
      city: scCity.value.trim() || "",
      tour: scTour.value.trim() || null,
      sets: sections
        .filter((sec) => sec.songs.length > 0)
        .map((sec) => ({ label: sec.label, songs: [...sec.songs] })),
      note: "",
      source_url: "",
      source_label: "",
    };

    const json = JSON.stringify(obj, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const filename = (scDate.value || "setlist") + (scVenue.value ? "_" + scVenue.value.replace(/\s+/g, "_") : "") + ".json";
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    toast("JSONをダウンロードしました");
  });

  // ===== Clear =====
  document.getElementById("scClear").addEventListener("click", () => {
    if (!confirm("セトリをクリアしますか？")) return;
    sections = [
      { label: "本編", songs: [] },
      { label: "アンコール", songs: [] },
    ];
    activeSection = 0;
    scDate.value = "";
    scVenue.value = "";
    scCity.value = "";
    scTour.value = "";
    renderSectionTabs();
    renderSetlist();
    renderSongs();
  });

  // ===== Saved list =====
  function persistSaved() {
    try {
      localStorage.setItem("bbb_setlists", JSON.stringify(savedSetlists));
    } catch (_) {}
  }

  function renderSavedList() {
    scSavedList.innerHTML = "";
    if (savedSetlists.length === 0) {
      scSavedList.innerHTML = '<p style="color:var(--ink-dim);font-size:0.75rem;padding:0.4rem 0;">保存済みのセトリはありません</p>';
      return;
    }
    savedSetlists.forEach((entry, i) => {
      const totalSongs = (entry.sets || []).reduce((n, s) => n + s.songs.length, 0);
      const label = [entry.date, entry.venue].filter(Boolean).join(" / ") || "(無題)";
      const div = document.createElement("div");
      div.className = "sc-saved-item";
      div.innerHTML = `
        <div class="sc-saved-item__info">
          <span class="sc-saved-item__date">${label}</span>${totalSongs}曲
        </div>
        <button class="sc-saved-item__load">読込</button>
        <button class="sc-saved-item__del" title="削除">✕</button>
      `;
      div.querySelector(".sc-saved-item__load").addEventListener("click", () => loadEntry(entry));
      div.querySelector(".sc-saved-item__del").addEventListener("click", () => {
        savedSetlists.splice(i, 1);
        persistSaved();
        renderSavedList();
        updateSavedCount();
      });
      scSavedList.appendChild(div);
    });
  }

  function loadEntry(entry) {
    scDate.value = entry.date || "";
    scVenue.value = entry.venue || "";
    scCity.value = entry.city || "";
    scTour.value = entry.tour || "";
    sections = (entry.sets || []).map((s) => ({ label: s.label, songs: [...s.songs] }));
    if (sections.length === 0) sections = [{ label: "本編", songs: [] }, { label: "アンコール", songs: [] }];
    activeSection = 0;
    renderSectionTabs();
    renderSetlist();
    renderSongs();
    toast("読み込みました");
  }

  function updateSavedCount() {
    scSavedCount.textContent = savedSetlists.length > 0 ? `保存済み ${savedSetlists.length}件` : "";
  }

  // ===== Toast =====
  let toastTimer = null;
  function toast(msg) {
    scToast.textContent = msg;
    scToast.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => scToast.classList.remove("is-visible"), 2200);
  }

  // ===== Mobile panel switch =====
  window.switchMobile = function (panel) {
    const picker = document.getElementById("scPicker");
    const builder = document.getElementById("scBuilder");
    const pickerTab = document.getElementById("scMobilePickerTab");
    const builderTab = document.getElementById("scMobileBuilderTab");
    if (panel === "picker") {
      picker.classList.add("is-mobile-visible");
      builder.classList.remove("is-mobile-visible");
      pickerTab.classList.add("is-active");
      builderTab.classList.remove("is-active");
    } else {
      builder.classList.add("is-mobile-visible");
      picker.classList.remove("is-mobile-visible");
      builderTab.classList.add("is-active");
      pickerTab.classList.remove("is-active");
    }
  };

  // Init mobile state
  if (window.innerWidth <= 680) {
    document.getElementById("scPicker").classList.add("is-mobile-visible");
  }
})();
</script>
</body>
</html>
